name: Website and contact API checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate.py
      - run: node --check assets/js/main.js && node --check assets/js/contact.js && node --check assets/js/contact-config.js
      - run: node --test backend/test/*.test.js
